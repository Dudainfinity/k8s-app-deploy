replicaCount: 3

image:
  repository: k8s-app
  tag: "1.0"
  pullPolicy: IfNotPresent

appVersion: "1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: app.localhost

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
